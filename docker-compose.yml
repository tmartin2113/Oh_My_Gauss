version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MCP_URL: http://127.0.0.1:3100/mcp
      PORT: "3000"
    volumes:
      # Persist vector store data across restarts
      - ./data:/app/data
    restart: unless-stopped
