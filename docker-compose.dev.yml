# Dev override — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Build locally first: npm run build && npm run build --prefix backend
version: "3.9"

services:
  app:
    environment:
      NODE_ENV: development
    volumes:
      # Mount compiled output for live-reload (rebuild locally to pick up changes)
      - ./dist:/app/dist:ro
      - ./backend/dist:/app/backend/dist:ro
